---
Name: signed-asset-urls
After:
  - '#assetadminroutes'
---
SilverStripe\Control\Director:
  rules:
    'signed-asset': 'Restruct\SilverStripe\SignedAssetUrls\Control\SignedAssetUrlController'

# Register middleware to auto-adjust cache headers
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        SignedAssetUrlCacheMiddleware: '%$Restruct\SilverStripe\SignedAssetUrls\Middleware\SignedAssetUrlCacheMiddleware'

# Core implementation on DBFile (handles both originals and variants)
SilverStripe\Assets\Storage\DBFile:
  extensions:
    - Restruct\SilverStripe\SignedAssetUrls\Extensions\SignedUrlDBFileExtension

# Thin wrapper on File that delegates to DBFile (for $file->getSignedURL() convenience)
SilverStripe\Assets\File:
  extensions:
    - Restruct\SilverStripe\SignedAssetUrls\Extensions\SignedUrlFileExtension
